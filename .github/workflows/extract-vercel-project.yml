name: Extract Vercel Project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Vercel ZIP
        shell: bash
        run: |
          set -e

          ZIP="CRAM-AI-VERCEL-FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found"
            exit 1
          fi

          mkdir -p /tmp/cram-vercel
          unzip -o "$ZIP" -d /tmp/cram-vercel

          cp -R /tmp/cram-vercel/. .

          rm -f "$ZIP"

          echo "Vercel project extracted successfully."

      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract CRAM AI Vercel project"
          git push
